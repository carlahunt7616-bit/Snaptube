name: Build SnapTube Release APK & AAB

on:
  push:
  workflow_dispatch:

jobs:
  build-release:
    name: Assemble Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Release Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            echo "Using production upload keystore from GitHub Secrets."
            echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=Production Upload Keystore (GitHub Secrets)" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret not configured. Generating a temporary CI signing key so Release APK/AAB can be built and tested. Add your permanent upload keystore secrets before publishing to Google Play."
            TEMP_PASS="snaptube_ci_release_key"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$TEMP_PASS" \
              -alias upload \
              -keypass "$TEMP_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MD AHOSHAN HABIB NAYON, OU=WebTecIT, O=WebTecIT, L=Dhaka, C=BD"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=Temporary CI Keystore (Configure GitHub Secrets for Play Store release)" >> "$GITHUB_ENV"
          fi

      - name: Build R8-Optimized Release APK & AAB
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Report Artifact Sizes
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          AAB_SIZE=$(du -h "$AAB_PATH" | cut -f1)
          {
            echo "## SnapTube Release Build Summary"
            echo "- **Signing Mode:** ${SIGNING_MODE}"
            echo "- **Release APK Size:** \`${APK_SIZE}\`"
            echo "- **Release AAB Size:** \`${AAB_SIZE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$APK_PATH" "$AAB_PATH"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapTube-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapTube-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
